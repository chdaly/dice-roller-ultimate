<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dice Roller Ultimate</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <div class="top-bar">
      <h1>🎲 Dice Roller Ultimate</h1>
      <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">🌙</button>
    </div>

    <div class="controls">
      <div class="control-group">
        <label for="diceColor">Die Color</label>
        <input type="color" id="diceColor" value="#f9fafb">
      </div>
      <div class="control-group">
        <label for="diceCount">Number of Dice</label>
        <select id="diceCount">
          <option value="1" selected>1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
      </div>
      <div class="control-group">
        <label for="romanToggle">Numerals</label>
        <label class="switch">
          <input type="checkbox" id="romanToggle">
          <span class="switch-track"><span class="switch-thumb"></span></span>
          <span class="switch-label">Roman</span>
        </label>
      </div>
    </div>

    <div id="diceContainer" class="dice-container"></div>
    <button id="rollBtn">Roll the Dice</button>
    <div class="history-panel">
      <h2>Roll History</h2>
      <div id="rollList" class="roll-list"></div>
      <div id="stats" class="stats"></div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
